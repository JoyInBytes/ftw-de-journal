name: Create Daily Learning Log

on:
  schedule:
    # 1:05 PM Philippine time
    - cron: "5 13 * * *"
      timezone: "Asia/Manila"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-daily-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Draft today's log from public GitHub activity
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: python .github/scripts/build_daily_log.py

      - name: Commit and push the new daily log
        if: steps.create.outputs.created == 'true'
        shell: bash
        run: |
          DATE_FILE="$(TZ=Asia/Manila date +'%Y-%m-%d')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "daily-logs/${DATE_FILE}.md"
          git commit -m "docs: draft daily learning log for ${DATE_FILE}"
          git push
